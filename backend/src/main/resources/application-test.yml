spring:
  datasource:
    url: jdbc:h2:mem:persona_engine_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: false

persona-engine:
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
  orchestrator:
    type: mock
  gateway:
    type: mock

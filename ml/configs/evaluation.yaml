# =============================================================================
# Persona Engine — Evaluation Configuration
# =============================================================================

evaluation:
  # Number of examples to evaluate (-1 for all)
  max_samples: -1

  # Generation settings for inference during evaluation
  generation:
    max_new_tokens: 256
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    do_sample: true
    repetition_penalty: 1.1

  # Metrics to compute
  metrics:
    - response_length_similarity
    - vocabulary_overlap
    - emoji_consistency
    - language_mixing_ratio
    # Future metrics (not yet implemented):
    # - perplexity
    # - bleu
    # - rouge
    # - semantic_similarity
    # - personality_alignment
    # - humor_consistency
    # - sarcasm_consistency

  # Comparison: generated vs reference persona messages
  comparison:
    min_reference_messages: 10

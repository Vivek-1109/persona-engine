# =============================================================================
# Persona Engine — Training Configuration (Placeholder)
# =============================================================================
# Actual training will use QLoRA / PEFT in a future phase.
# These values serve as starting-point defaults.
# =============================================================================

training:
  # Method: qlora | lora | full (future)
  method: "qlora"

  # QLoRA / PEFT parameters
  lora:
    r: 64
    lora_alpha: 16
    lora_dropout: 0.1
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
    bias: "none"
    task_type: "CAUSAL_LM"

  # Quantization
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true

  # Training hyperparameters
  hyperparameters:
    num_train_epochs: 3
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    max_grad_norm: 0.3
    fp16: true
    bf16: false
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    save_total_limit: 3

  # Output
  output_dir: "experiments"
